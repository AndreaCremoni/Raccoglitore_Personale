<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andrea Cremoni - Raccoglitore Personale</title>
  <style>

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #121212;
      color: #e3e2e6;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      position: relative; 
    }

    .main-title {
      text-align: center;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 0.5px;
      margin: 0;
      padding-top: 40px; 
      color: #ffffff;
    }

    .btn-tesi {
      position: absolute;
      top: 120px;  
      left: 50px; 
      display: inline-block;
      background-color: #a83232; /* Rosso laurea */
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      padding: 12px 24px;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-tesi:hover {
      background-color: #bd3a3a; 
    }

    .btn-tesi:active {
      transform: scale(0.98);
    }
